name: Hero Shimmer Visual Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  shimmer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Hero shimmer stability tests
        run: npx vitest run src/components/__tests__/HeroShimmer*.test.tsx --reporter=verbose

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            **/__snapshots__/
